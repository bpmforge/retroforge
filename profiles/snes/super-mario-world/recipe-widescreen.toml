# W38-04: widescreen finder rows for Super Mario World, an OVERLAY on recipe.toml
# (recipe format v1; append this file's text to that recipe to load it:
# crates/rf-harness/tests/w38_04_rows.rs does exactly that and checks the grades).
# It is a separate file because rf-profiles' own test pins the recipe file's
# patch rows to the three W36-06 ones.
#
# Finder: crates/rf-rebuild/src/widescreen.rs. Trials: crates/rf-harness/tests/
# w38_04_widescreen_*.rs. Offsets and constants only (law 5).
#   mod "widescreen-objects":    lockstep keepers. With every row of the mod applied
#       together, the first divergence from the unmodified run touched only
#       off-screen object state (OAM and camera identical), and live objects
#       were kept farther out than the unmodified game keeps them.
#   mod "widescreen-candidates": finder output no trial kept (the constant
#       never mattered in the run, or the change was visible). Graded candidate:
#       no patch ever applies them.
#   W38-04b: observed over 30,309 frames in three power-on runs (two TAS movies and a
#       Yoshi's Island 1 patrol; 33 level entries, 4 translevels, 190 state flips up
#       / 183 down against W38-04's 5 / 5). One keeper pair: the 16-bit adc/cmp window
#       at ROM 0xa459 / 0xa45c widened by 0x80 each side (the pair must change together;
#       marginal: objects kept 19 px farther left, and the picture differs 7 frames
#       after the first off-screen divergence). Everything else: candidate.
#   mod "widescreen-hud": none for SMW (its HUD is background tiles, not sprites).
