# Star Fox - made by RetroForge's profile census, then given its one
# speed-governor row by hand (W30-01c).
#
# These dumps' identity comes from hashing them (No-Intro "Star Fox (USA)"
# and "(Rev 1)"). The only row is `[overclock].tick_counter`, so the Super FX
# overclock can be governed; no RAM map, no camera.

[meta]
profile_version = "0.1"
title = "Star Fox"
console = "snes"
region = "ntsc"
authors = ["RetroForge profile census"]
sources = []

