[capabilities]
full_level = false
hud_separation = false
entity_overlay = false

[overclock]
# Found by observation 2026-10-15 (W30-00 probe): a WRAM byte that steps once per game tick — ~3/s, 5-6/s, 8-9/s at GSU 100/200/400% before the W30-00 fix, ~18/s at 100% after it.
tick_counter = 0x7E15BD
# W30-01d (2026-10-15, observation): in the attract demo at 100% the light 3D
# scenes hold a flat 30 ticks/s (60/2, the game's own frame limiter) and heavy
# flight drops to 15-20; menus/2D scenes count every frame (60). The governor
# target is that unslowed 3D rate, so it only ever lifts slowdown back toward
# 30 and never past it. A learned target picked 30 or 60 depending on what
# was on screen, which is why it is pinned here.
target_tick_hz = 30

# W31-02: where Star Fox's 3D rasteriser can be observed handing the GSU a
# polygon -- found 2026-10-15 by watching our own emulator run the user's dump
# (GSU RAM reads/writes with the instruction address that made them, and every
# PLOT); no disassembly, no source. See docs/research/W31-01-starfox-polygon-map.md.
# Used only by the polygon observer behind the (opt-in) Star Fox re-rasteriser;
# Accuracy Mode never reads it.
[superfx_polygons]
pc_bank = 0x01                  # the code below runs in GSU program bank 01
count_read_pc = 0x8DE0          # reads the polygon's vertex count: starts a polygon
count_addr = 0x0134             # GSU RAM: the vertex count
buffer_addr = 0x0982            # GSU RAM: clipped corners, 4-byte entries (x word, y word); only the low bytes are meaningful
walker_pcs = [0xA6C0, 0xA740]   # the edge walker's corner reads, [start, end)
viewport = [224, 170]           # the 3D view, in pixels
