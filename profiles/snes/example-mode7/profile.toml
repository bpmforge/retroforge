# Schema v0 (docs/design/GAME_PROFILES.md §2) demonstration profile,
# authored for ticket W4-02, not derived from a real commercial game.
#
# Deliberately smaller than profiles/nes/rf-scroller-demo/profile.toml: it
# exercises console = "snes", a `[[identity]]` entry keyed on sha1 alone
# (proving the loader doesn't require sha256 specifically -- FR-PROF-002's
# "any of the hash families"), and a "top_down_rooms" camera mode, without
# repeating every optional section the NES example already covers.

[meta]
profile_version = "0.1"
title = "SNES schema demo"
console = "snes"
region = "ntsc"
authors = ["RetroForge W4-02"]
sources = ["synthetic example for schema v0 demonstration; not a real game"]

[meta.requires]
chips = ["DSP-1"]

[[identity]]
sha1 = "0000000000000000000000000000000000000000"
revision = "1.0"

[capabilities]
full_level = false
hud_separation = false
entity_overlay = false
widescreen = "none"
fast_load = true
smooth_camera = true

[camera]
mode = "top_down_rooms"

[camera.x]
addr = 0x0F10
type = "u16"
scale = 1

[camera.y]
addr = 0x0F12
type = "u16"
scale = 1

# [decode] REMOVED by ticket W9-08.
#
# This profile declared `kind = "room_grid"` from W4-02 until 2026-08-21
# while configuring NOTHING — no [decode.room_grid] table and no
# [[rom_map]] entries — because no such family existed to configure
# against. It decoded nothing and looked configured, which is precisely
# the vacuous artifact W9-08 was told not to produce more of.
#
# Now that `room_grid` IS implemented, the declaration stopped being
# merely inert and became a live falsehood: spec_from_profile would
# refuse it with MissingSpec. There is no Mode 7 fixture with room data
# behind this profile, and inventing offsets to satisfy the schema would
# be inventing facts — so the claim is withdrawn rather than dressed up.
#
# Working room_grid profiles, both backed by authored fixtures with
# published construction rules:
#   profiles/nes/rf-rooms          — indexed (room reuse)
#   profiles/snes/rf-rooms-flat    — unindexed
