# Super Mario Bros. 3 — made by RetroForge's profile census (W25-02).
#
# The camera was found by playing this exact dump headlessly
# (crates/rf-harness/tests/profile_census.rs): every work-RAM byte was
# scored by how often it held the low byte of the frame's scroll
# register while the screen moved. x matched 100% of 183 scrolling frames.
# The census reached World 1-1 through the map (Brad's route: right,
# up, A). Item rows below are cited; their notes say what play showed.

