# Metroid (USA) -- a documented-commercial-title profile (W11-06, D-009).
#
# Verified 2026-09-18 against sha256
# 649db8035018f2512ccea70aca6606c3b3a6988cd9ed43953b38dc5103dec7bb
# ("Metroid (USA).zip", No-Intro) with title_probe (a standalone harness
# built against this worktree's rf-cart/rf-nes crates, mirroring
# crates/rf-harness/tests/title_probe.rs's ROM-loading/peek conventions
# and driving Start/A/Right through `EmulatorCore::run_frame`'s
# `InputFrame`): after two Start presses to clear the title screen and the
# continue-code entry screen, then an A press and a held Right, Samus's
# state moved exactly as the RAM map predicts --
# $0050 (x position on map) climbed 0x00 -> 0x03 -> 0x04 -> 0x05 as she
# crossed screen boundaries walking right out of the starting elevator
# shaft; $0051 (x position on screen) tracked within-screen movement
# (0x8F -> 0xDC) over the same span; $0052 (y position on screen) rose
# from 0xB1 to 0xC1 during the opening fall from the ship and then held
# steady once she landed. All three are dynamic, verified-live game state,
# not open-bus noise (a control run with no input at all left the
# corresponding memory thrashing incoherently on the still-animating
# title screen, confirming these addresses are inert until the game
# itself claims them).
#
# ## What could not be verified, and was dropped rather than guessed
#
# - $0106-$0107 (documented "Health - BCD, fixed point") and $0074
#   ("Current level") never settled to a value consistent with the
#   documented starting energy (99) or starting area (Brinstar, $10) in
#   any run reaching the point above -- Samus had not yet passed the
#   elevator into a numbered room, so this profile does not assert an
#   address it could not see take a plausible value.
# - $005A ("Index of room layout being loaded") stayed pinned at 0xFF
#   through every run above, including runs where $0050 had already
#   incremented across two screen boundaries -- consistent with the
#   documented fact that Metroid's opening elevator sits outside the
#   normal room-number space, but not itself a verified "this is room
#   N" reading, so it is left out.
# - Data Crystal's Metroid ROM map documents the tile/room table layout
#   in general terms but gives no single fixed table address this
#   profile could cite for `[decode]` without inventing bank-relative
#   offsets the page does not state plainly, so `[decode]` is omitted
#   (same reasoning `profiles/nes/legend-of-zelda` uses for the same gap
#   in the same document family).

