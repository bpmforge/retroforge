[[memory_map]]
addr = 0x0051
len = 1
type = "u8"
label = "samus_x_screen"
notes = "X position within the current screen; verified tracking movement (0x8F -> 0xDC) alongside samus_x_map."
source = "https://datacrystal.tcrf.net/wiki/Metroid/RAM_map"

[[memory_map]]
addr = 0x0052
len = 1
type = "u8"
label = "samus_y_screen"
notes = "Y position within the current screen; verified rising (0xB1 -> 0xC1) during the opening fall, then holding once Samus landed."
source = "https://datacrystal.tcrf.net/wiki/Metroid/RAM_map"
