# W32-09: the level scout, Air Man's stage, first horizontal section. Every
# address below was found or confirmed by observation
# (docs/research/W32-09-scout-nes.md). Writing the camera repeats the first
# 512 px (the game streams the level only for a player who moves) and poking
# Mega Man's X does not move the camera, so the scout holds Right on its own
# pad and Mega Man's Y near the top of the screen (out of reach of the pits
# and of the Air Tikki).
[scout]
strategy = "walk"
step_px = 1
frame_budget = 3000
stall_frames = 60
settle_frames = 60
dirs = ["right"]

[[scout.addr]]
role = "hold"
addr = 0x04A0
value = 0x20
notes = "Mega Man's Y: 0x74 standing on the first platform, 0xf0 once he has fallen into a pit. Held at 0x20 he floats above the obstacles that stop a held Right at 0x60 and lower."
source = "observed: W32-09 note"

# W33-08: the vertical sections. Air Man's first one is a shaft the game
# scrolls only when Mega Man's Y reaches the bottom of the screen: from the
# cloud platform at its top (Y 0x54) a Y of 0xF0 or more starts a downward
# screen transition (about 4 px a frame, $20 0x0A -> 0x0B). Standing on the
# platform the game puts a poked Y back on it, so the Y pass pokes from its
# own running target (and the hold above, which pins him at the TOP, is
# released on a vertical pass because this row names the same byte).
[[scout.addr]]
role = "player_y"
addr = 0x04A0
notes = "Mega Man's Y, one byte (no high byte): 0x54 standing on the first cloud platform of the climb, 0xF0 or more starts the downward screen transition, 0x07..0x0B on landing at the top of the next screen."
source = "observed: W33-08 probe (tests/w33_08_vertical.rs)"

[[scout.addr]]
role = "start_when"
addr = 0x06C0
value = 0x1C
notes = "Mega Man's health, 0x1c (28) at the start of a stage. The scout starts only at full health: health is not an alive flag (it still read 0x1a after the fall that ended a run), so a hurt Mega Man is not scouted."
source = "observed: W32-09 note"

# W33-09: which stage the game is in, and how a stage is cut into scenes.
# `$2A` holds the stage's index from the moment the stage starts (Air Man 1,
# Metal Man 2, Wood Man 3, Bubble Man 5; docs/research/W33-09-scenes.md); the
# menus use it as a cursor, so it is non-zero there too and each cursor
# position is its own (empty) scene. No byte names the SECTION of a stage
# (measured over the first horizontal section and the climb that follows it),
# so sections are cut by the scroll axis: the screen stops going right and
# starts climbing.
[scene]
sections = "axis"

[[scene.level_id]]
addr = 0x002A
notes = "Stage index: 1 in Air Man's stage for its whole length (horizontal and vertical sections), 3 Wood Man, 5 Bubble Man, 2 Metal Man; 0 on the title."
source = "observed: W33-09 note"
