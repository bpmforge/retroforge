# LoROM linker config for the mirror-map fixture (ticket W6-06).
#
# Hand-written rather than taken from libSFX: this fixture needs exactly
# one 32 KiB bank, a header and vectors, and a framework's init code and
# macros would be a large dependency contributing nothing a mapping test
# uses. See build.sh for why cc65 rather than asar/libSFX at all.
MEMORY {
    ZP:     start = $000000, size = $0100, type = rw, define = yes;
    RAM:    start = $000100, size = $1F00, type = rw, define = yes;
    # LoROM maps bank $80's upper half to ROM $0000. The ROM image is a
    # flat 32 KiB; $8000 is where the CPU sees its first byte.
    ROM:    start = $8000,   size = $7FC0, type = ro,  file = %O, fill = yes, fillval = $00;
    # The cartridge header lives at $FFC0, NOT $FFB0 -- $FFB0-$FFBF is the
    # optional EXTENDED header, and putting the title there produces a ROM
    # whose title reads as garbage five bytes into itself. (It did: the
    # first build of this fixture reported its title as "XTURE".)
    HEADER: start = $FFC0,   size = $0020, type = ro,  file = %O, fill = yes, fillval = $00;
    VECTORS:start = $FFE0,   size = $0020, type = ro,  file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:    load = ROM,     type = ro,  start = $8000;
    SNESHDR: load = HEADER,  type = ro,  start = $FFC0;
    VECTORS: load = VECTORS, type = ro,  start = $FFE0;
}
