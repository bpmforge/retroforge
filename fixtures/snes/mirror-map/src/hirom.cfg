# HiROM linker config for the mirror-map fixture (ticket W6-06).
#
# 64 KiB rather than LoROM's 32: HiROM maps a bank's FULL 64 KiB (banks
# $C0+ at $0000-$FFFF), so a 32 KiB HiROM image would leave half of bank
# $C0 unmapped and the "does the bus map a whole bank" question — the one
# thing distinguishing HiROM from LoROM here — would be untestable.
MEMORY {
    ZP:      start = $000000, size = $0100, type = rw, define = yes;
    RAM:     start = $000100, size = $1F00, type = rw, define = yes;
    # The CPU sees this bank at $C0:0000. Code sits in the upper half so
    # the same source works under both configs without relocation.
    LOWHALF: start = $0000,   size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM:     start = $8000,   size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HEADER:  start = $FFC0,   size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFE0,   size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:    load = ROM,     type = ro,  start = $8000;
    SNESHDR: load = HEADER,  type = ro,  start = $FFC0;
    VECTORS: load = VECTORS, type = ro,  start = $FFE0;
}
