# File order IS bank order: the first 16 KiB after the header is bank 0,
# the next is bank 1, and so on. Bank 1 must be the FIXED bank, because
# mode 3 with outer = 0 puts (outer << 1) | 1 = 1 at $C000 -- so the code
# and the vectors have to live there or the reset vector is unreachable.
MEMORY {
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    B0:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B1:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B2:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B3:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B4:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B5:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B6:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    FIX:    start = $C000, size = $3FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC:    start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = B0,     type = ro;
    BANK1:   load = B1,     type = ro;
    BANK2:   load = B2,     type = ro;
    BANK3:   load = B3,     type = ro;
    BANK4:   load = B4,     type = ro;
    BANK5:   load = B5,     type = ro;
    BANK6:   load = B6,     type = ro;
    FIXED:   load = FIX,    type = ro;
    VECTORS: load = VEC,    type = ro;
}
