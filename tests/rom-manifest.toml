# protocol = "ram_result" (ticket W1-05b pre-flight finding, corrects the
# board's earlier "six_thousand" tag): sprite_hit_tests_2005.10.05 predates
# blargg's shared $6000/$6004 runtime entirely -- verified two ways against
# the pinned commit 95d8f621ae55cee0d09b91519a8989ae0e64753b: (1) readme.txt,
# verbatim, "Each test ROM runs several tests and reports the result on
# screen and by beeping a number of times" (no $6000 mention at all); (2)
# grepping every file under sprite_hit_tests_2005.10.05/source/runtime/ for
# "6000"/"DE B0 61" found zero matches. Empirically, tagging it
# "six_thousand" made all 11 ROMs time out (TimeoutBeforeSignatureValid)
# every run -- the $6001-$6003 signature this protocol waits for never
# gets written because these ROMs never write it. The SAME runtime's
# source/runtime/validation.a DOES define a real RAM result byte instead
# ("result = $f8"; "tests_passed: lda #1 / sta result"; else an error code,
# then an infinite halt loop) -- rf-harness::blargg_evidence::run_ram_result
# reads it. sprite_overflow_tests (a separate suite, not touched by this
# ticket) shares this ROM family's runtime and almost certainly has the
# same "six_thousand" mistagging; left as-is, out of this ticket's
# acceptance criteria -- a future ticket's problem, flagged here rather
# than silently carried forward.
