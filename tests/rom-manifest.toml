# The one real community Mesen HD pack this repo tests against (W9-06
# criterion 3: "a real community pack is imported end to end in a test").
#
# WHY A FETCH AND NOT A FIXTURE: no licence-clear HD pack exists. Every
# pack in the wild is a derived work of copyrighted commercial game art,
# and all three candidates surveyed (TasticHacks/Contra80s,
# AxlRocks/Megaman-Super, ModernRetroDesign/ZII-mesen) report NO LICENSE
# on GitHub. Brad ruled 2026-08-21 that the fetch-only posture already
# carried by 81 entries here applies: fetch-from-origin only, never
# vendored/mirrored/re-hosted, dest under gitignored roms/. The honest
# caveat that ruling turned on: those 81 are hardware-conformance test
# ROMs; this one is commercial game art, and that is a real difference.
#
# WHY THIS PACK: it is a genuine <ver>106 pack with 5,976 <tile> rules,
# 302 <condition>s and 89 <img> refs — proving the importer against a
# pack from the WILD rather than one we authored, which is the entire
# point of the criterion. Contra80s was the obvious first candidate and
# was rejected on inspection: it contains no hires.txt at all, only a
# README and 47 MB of promo banners.
#
# WHY THREE SUBPATHS: hires.txt references 69 root images plus 10 under
# Submerged/ and 10 under Cutscenes/. Cone mode always includes root
# files, so those two directories are all that must be named — but
# fetching only the root would make the importer report 20 tiles as
# MissingImage for a gap OUR fetch created, not the pack's. That is the
# silent-degradation failure this whole ticket is about.
[[git_artifact]]
id = "mesen-hdpack-megaman-super"
license_status = "no-license-grant-fetch-only"
repo = "https://github.com/AxlRocks/Megaman-Super.git"
commit = "be6f9c23335666aaface41d4598a299a09ab110b"
subpaths = ["Submerged", "Cutscenes"]
dest = "roms/nes/mesen-hdpack-megaman-super"

# RETIRED at W6-01a — the ticket that actually consumes these vectors.
#
# The entry that stood here declared the whole-repo zip
# (0cd1613c2373836bff01cb60eb41cafd71c7b994536848915788e5ffb68db7e1,
# 490157719 bytes) and left a TODO asking whether rf-harness should fetch
# a 490 MB archive per run or whether "a leaner per-opcode subset should
# be curated instead".
#
# Neither. The question had a false premise: upstream is ALREADY
# per-opcode. Commit db6b104's `v1/` directory holds 512 files —
# `<opcode>.e.json` and `<opcode>.n.json`, one pair per opcode for
# emulation and native mode — so the granularity the TODO wanted to
# hand-curate exists for free, and there is no archive to unpack (which
