# ---------------------------------------------------------------------------
# Artifacts — blargg's recovered SPC test ROMs (W7-08 criterion 3).
#
# Blargg's SPC test ROMs were long thought lost; byuu found them on an old
# thumb drive and qwertymodo posted them to the nesdev forum. They are
# WORK IN PROGRESS ROMs — the "6" is a version number, the last build
# blargg sent byuu — which is exactly why byuu's own caveat is reproduced
# here instead of being paraphrased away:
#
#   "passing these tests are not a proof of correctness as such. What they
#    are, to me, is a proof of correctness of blargg's DSP core."
#
# So this set verifies against the reference IMPLEMENTATION, not against
# silicon. That is the honest limit, and it is still a large step past
# "implemented and unit-tested", which is what the S-DSP had before.
#
# Pinned to the same commit and repository that already supplies gilyon.
# No license grant: fetch-from-origin only, never vendored or re-hosted.
# ---------------------------------------------------------------------------

