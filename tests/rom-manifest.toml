# Test-ROM manifest (ticket W0-03; NFR-006, TESTING.md §3, FAILURE_MODES.md
# FM-14). Parsed by `rf_harness::manifest`; fetched by
# `scripts/fetch-test-roms.sh` (a thin wrapper over the `fetch-test-roms`
# binary in `crates/rf-harness`) into the gitignored `roms/` directory.
# NEVER add a ROM binary to git — this file records where to get one and
# what its verified hash is, nothing else.
#
# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#
# [[artifact]] — one fetchable, byte-identical unit (always a single file;
#   this manifest deliberately has no archive-unpack step — see
#   crates/rf-harness/src/fetch.rs module doc for why).
#   id              unique key, referenced by [[suite.roms]].artifact
#   license_status  "no-license-grant-fetch-only" | "public-domain" |
#                    "permissive" — no-vendor/no-rehost rule (TESTING.md §3,
#                    design-review G-43): no-license-grant artifacts are
#                    fetch-from-origin only, never vendored/mirrored/
#                    re-hosted; the CI cache is the only tolerated copy.
#   sha256          one hash; EVERY URL in `mirrors` must serve exactly
#                    these bytes. "TODO-<reason>" is an honest placeholder
#                    for a hash not yet computed (network-unreachable during
#                    authoring, or the artifact is a multi-hundred-MB
#                    archive not worth downloading just to prove the
#                    pattern) — never a fabricated value.
#   mirrors         ordered list of alternate-origin URLs (FM-14 mitigation:
#                    "multiple mirrors pre-listed"). The fetcher tries them
#                    in order and accepts the first whose bytes hash to
#                    `sha256`; all failing is a loud error naming the
#                    artifact id (FM-14). A URL belongs in this list ONLY
#                    if it has been verified to serve byte-identical
#                    content — see the nestest-log entry below for a
#                    real counterexample (two real-looking "mirrors" that
#                    turned out to differ by line-ending normalization and
#                    therefore are two different artifacts, not one).
#   dest            path under `roms/` (gitignored — NFR-006) the verified
#                    bytes are written to.
#
# [[git_artifact]] — a pinned-commit, sparse-subpath git checkout (ticket
#   W0-07). The one deliberate exception to "[[artifact]] is always a
#   single file": used where the upstream source is naturally a directory
#   of many small files (e.g. SingleStepTests' per-opcode vector JSON) and
#   a whole-repo zip [[artifact]] would be both wasteful and, for
#   codeload.github.com specifically, silently truncatable (no
#   Content-Length on the stream — see the singlestep-nes6502-src entry
#   below for the real incident this replaced). Integrity comes from
#   `commit` alone, NOT a sha256 — see crates/rf-harness/src/manifest.rs
#   module doc for why an archive-style hash would be redundant here.
#   id              unique key, referenced by [[suite.roms]].artifact —
#                    shares one namespace with [[artifact]].id
#   license_status   same vocabulary/rule as [[artifact]].license_status
#   repo             git clone URL
#   commit           40 lowercase hex chars, the pinned commit SHA; after
#                    fetch, `git -C <dest> rev-parse HEAD` must equal this
#   subpaths         directories within the repo passed to
#                    `git sparse-checkout set --cone` — a LIST, because
#                    cone mode takes N of them (and always includes
#                    root-level files regardless). One string could not
#                    express an artifact whose content sits in several
#                    sibling directories; fetching only part of it and
#                    letting the consumer report the rest as missing would
#                    manufacture a gap that is an artefact of the fetch
#                    rather than of the artifact (ticket W9-06).
#   dest             path under `roms/` (gitignored) the checkout lands at
#                    — a DIRECTORY, not a file
#
# [[suite]] — the accuracy-table / waiver lookup key. `id`+`fr`+`tier` are
#   copied verbatim from docs/TESTING.md §4 (NES) / §5 (SNES); this pairing
#   is DATA, never inferred at runtime (TESTING.md §5: "a lookup from the
#   tables above, never a judgment call"). Suite rows in TESTING.md that
#   bundle several named blargg test programs into one FR/tier cell (e.g.
#   "cpu_timing_test6/instr_timing/branch_timing_tests") are split here
#   into one [[suite]] per named program, each carrying the identical
#   FR/tier the bundled row specifies — this is finer accuracy-table
#   granularity, not a different mapping.
#   id        suite id (accuracy-table + waiver key)
#   console   "nes" | "snes"
#   fr        FR-CORE-xxx from TESTING.md
#   tier      "A" (every PR) | "B" (nightly)
#   protocol  "six_thousand" (blargg $6000/$6004) | "trace_log" (nestest) |
#             "vector" (SingleStepTests JSON, no ROM run) | "golden_frame" |
#             "ram_result" (RAM block vs shipped expected-value file) |
#             "audio_rms" | "screen_text" (verdict is only on the nametable,
#             scored by blargg's own "if a test prints 'passed', it passed")
#   [[suite.roms]]  one row per accuracy-table ROM
#     artifact       artifact id above
#     rom            accuracy-table row label (not necessarily the filename)
#     frame_budget   declared timeout in frames (TESTING.md §2); 0 for
#                    protocols with no frame concept (vector)
#
# In-repo fixtures (RF-Scroller, RF-Scroller-S, libSFX LoROM/HiROM maps) are
# built from source in CI, never fetched externally (fixture doctrine
# D-001) — they have no entry here by design; see FR-CORE-026/035/037 in
# TESTING.md (FR-CORE-026 here is the Alter Ego row, the one FR-CORE-026
# source that IS external; the RF-Scroller replay half of that same FR is
# the in-repo one and stays out of this manifest).
#
# Known gaps (blocked-with-evidence, not silently dropped):
#  - Holy Diver Batman (FR-CORE-025, tier B): docs/research/
#    accuracy-and-testing.md already flags this "[thin on exact repo
#    path]". No GitHub repo, release, or author mirror was located this
#    session (rainwarrior has no public repo by that name; pinobatch/
#    holy-mapperel is a *different* project — NES cartridge PCB
#    manufacturing test, not the mapper acid-test ROM).
#  - blargg SPC timing / spc_timing (FR-CORE-036, tier B): RESOLVED
#    2026-08-21 (W7-08). The old flag said blargg.org was dead and named
#    gitlab.com/higan/snes-test-roms as a "[thin]" candidate whose exact
#    ROM path was never located. It is `blargg-spc-6/`, and all four ROMs
#    are pinned below at commit 26e8aa91 — the same repository that
#    already supplies gilyon. Kept rather than deleted because the shape
#    of the gap is the useful part: the canonical home rotting did not
#    mean the artifact was gone, only that nobody had looked in the
#    mirror's directory listing.
# Holy Diver Batman still has no [[suite]] row: a pre-existing "thin"
# flag from the research doc, not new rot.

# ---------------------------------------------------------------------------
# Artifacts — NES, christopherpow/nes-test-roms aggregator
# (no license grant; fetch-from-origin only). Pinned to commit
# 95d8f621ae55cee0d09b91519a8989ae0e64753b (verified live 2026-08-02) so a
# manifest re-run never silently picks up an upstream rewrite.
# ---------------------------------------------------------------------------

