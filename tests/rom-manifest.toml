# nes6502 (ticket W0-07): this used to be a whole-repo-zip [[artifact]]
# (id "singlestep-nes6502") fetched from codeload.github.com. Retired: (1)
# the pinned sha256 never matched what codeload actually served for that
# commit — codeload streams with no `Content-Length` header, so a
# multi-GB transfer can truncate silently into a still-valid-looking zip
# (verified at W1-01a: manifest declared
# ed89588aa3de8cf087861de57f079f3a5ab050dd9de3dfcfa07598b65db6cf75, the
# real download hashed to
# 05b602aeb508c62c5aaee259475f8d5e949ed4a9aba0f8220b67ba78708d2d71); (2)
# it fetched the entire multi-architecture ProcessorTests repo when only
# nes6502/v1 (~1.0 GB uncompressed) was ever needed. Replaced by the
# [[git_artifact]] below: a `--filter=blob:none` sparse-checkout at the
# same pinned commit, verified live (git 2.55.0) to work by bare SHA
# fetch, whose integrity check is the commit SHA itself rather than an
# archive hash — see crates/rf-harness/src/manifest.rs module doc.
[[git_artifact]]
id = "singlestep-nes6502-src"
license_status = "no-license-grant-fetch-only"
