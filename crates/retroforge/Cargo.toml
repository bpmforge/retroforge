[package]
name = "retroforge"
description = "RetroForge frontend application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# image: decode the PNGs a Mesen HD pack ships (ticket W11-05). PNG ONLY
# and default-features off — a pack is PNG by the format's own spec, and
# the default feature set drags in every codec `image` supports for no
# reason. This crate is also a dev-dependency below (W10-03 screenshots);
# the two entries unify per build, so `cargo build` gets png alone and the
# test build gets whatever the dev entry asks for.
image = { version = "0.25", default-features = false, features = ["png"] }
rf-core-api = { path = "../rf-core-api" }
# rf-nes: to actually run a core (pre-flight note, ticket W1-06 plan.json
# entry) — exempt from "cores only via rf-core-api" as the app shell
# itself (scripts/validate-arch.sh rule 3).
rf-nes = { path = "../rf-nes" }
# rf-cart: console-agnostic cartridge sniff/validate for the ROM open
# dialog (pre-flight note) — lets "wrong console" be reported before ever
# handing bytes to rf-nes, and is what the synthetic-NROM test fixtures
# below build against (same pattern as rf-harness's own dev-dependency use
# of rf-cart).
rf-cart = { path = "../rf-cart" }
# rf-state: the .rfstate container (ticket W2-04) — the app shell is the
# only layer that may know both a core's state regions and rf-state's chunk
# tags, since core crates may not depend on rf-state (validate-arch.sh).
rf-state = { path = "../rf-state" }
# rf-audio: ring, dynamic rate control and the output-stage filters
# (ticket W2-05). The `device` feature (cpal) is enabled by the binary, not
# here, so `cargo test --workspace` needs no ALSA headers.
rf-audio = { path = "../rf-audio" }
rf-renderer = { path = "../rf-renderer" }
# rf-input: host-agnostic Key/KeyMap/InputLatch + .rfreplay (ticket W1-07).
rf-input = { path = "../rf-input" }
# rf-enhance: SceneGraph/Camera/Stitcher/SceneTracker (ticket W4-03e) — the
# shell is the mediator that resolves rf-enhance's handles into
# rf-renderer's CompositeLayer (ARCHITECTURE.md §3: UI depends on both REN
# and ENH; no edge between REN and ENH themselves).
rf-enhance = { path = "../rf-enhance" }
# rf-cache: already an rf-enhance dependency (arrives transitively for
# version-resolution purposes), listed directly here too because
# `crate::canvas_accum` calls `rf_cache::Cache::open` itself (Rust's
# extern prelude only exposes crates a Cargo.toml names directly).
rf-cache = { path = "../rf-cache" }
# rf-debugger: viewer data providers + persisted-layout data model (ticket
# W4-06a) — this crate is the shell-mediation point `rf-debugger`'s own
# pre-flight notes call for: `rf-debugger` may not depend on `rf-nes`
# (scripts/validate-arch.sh rule 3), so it never sees CHR/OAM/event bytes
# itself. `retroforge` reads them (it already depends on `rf-nes` above)
# and hands plain `&[u8]`/`&[CoreEvent]` slices to `rf-debugger`'s decode
# functions — same resolution as SceneGraph at W4-03c/W4-03e.
rf-debugger = { path = "../rf-debugger" }
# rf-profiles: promoted from a dev-dependency by ticket W5-03. The shell
# is the layer that knows a ROM's identity hash AND can reach the
# filesystem, so it is where a profile gets matched to the game that just
# opened (`crate::level_view`). ARCHITECTURE.md §3 draws `UI --> ENH` and
# `ENH --> PRO`; the shell already depends directly on three of the four
# enhancement-side crates (rf-enhance, rf-debugger, rf-plugin-sdk) for the
# same mediation reason, and `scripts/validate-arch.sh` restricts only the
# console cores. Profiles are DATA, never code (ARCHITECTURE.md §3's own
# table: "executable code (data only; code = plugins)").
# rf-snes: the SNES core. Same exemption as rf-nes above -- the app
# shell is the layer that owns save-state containers, and W7-09 needs
# both the core's regions and rf-state's chunks in one place.
rf-snes = { path = "../rf-snes" }
rf-profiles = { path = "../rf-profiles" }
# rf-plugin-sdk: the Lua script host (ticket W4-04). The shell owns the
# REPL panel and the capability/ledger surfaces; the SDK owns the sandbox.
rf-plugin-sdk = { path = "../rf-plugin-sdk" }
eframe = "0.35.0"
rfd = "0.17.2"
# log + env_logger: ticket W14-20's env-filtered logger, so `RUST_LOG=
# eframe=trace,egui_winit=debug` can be captured on the next UI-freeze
# stall without a rebuild. Both MIT/Apache-2.0 (NFR-011); `log` was
# already pulled in transitively by half the dependency graph (see
# Cargo.lock), this is just naming it directly so `crate::core_thread` and
# `main.rs` can call it. `env_logger` is new, `default-features = false`:
# the default `regex` feature only powers message-content filtering
# (env_filter's `op.rs`), not the `target=level` directives RUST_LOG needs
# here, and `auto-color`/`color`/`humantime` are terminal-polish this
# ticket has no use for — dropping them skips anstream/anstyle/jiff
# entirely. `env_logger::init()` still reads RUST_LOG and stays silent
# when it is unset, which is this ticket's "silent by default" acceptance
# note.
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# sha2: reachable-state hash for the determinism/replay suite (ticket
# W1-07) — already an approved dependency (docs/TECH_STACK.md §2 row
# exists via rf-cart's use of it).
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# egui_dock: sanctioned at docs/TECH_STACK.md §2 ("Docking" row, "Mesen-
# style dockable viewer layout") — ticket W4-06a criterion 3. The `serde`
# feature is deliberately NOT enabled: `DockState<Tab>`'s own tree embeds
# `egui::Rect` (whose `Serialize`/`Deserialize` impls are behind egui's own
# `serde` feature, unverified/unenabled in this workspace's `eframe` build)
# and a mixed unit/tuple-variant `Node<Tab>` enum inside a `Vec` — exactly
# the shape TOML's serde support (this workspace's only sanctioned
# serialization format, `docs/TECH_STACK.md` §2 "Config/profiles" row)
# breaks on. `crate::debug_dock` instead owns a small versioned layout
# format it controls (`rf_debugger::layout::PersistedLayout`) and walks
# `DockState`'s public `Tree`/`Node`/`SplitNode`/`LeafNode`/`split()` API
# (all plain data + safe constructors, verified against the vendored
# `egui_dock-0.20.1` source, not training data) to capture/restore it —
# see that module's doc for the full reasoning.
egui_dock = "0.20.1"
# rtrb: already sanctioned at docs/TECH_STACK.md §2 ("Audio ring" row,
# "lock-free SPSC, realtime-safe") and already in the tree via rf-audio.
# Ticket W4-10a uses it for the same reason one layer up: the trace
# transport must never block the core thread (DEBUGGER.md §2).
rtrb = "0.3.4"
# lz4_flex: trace-to-file framing (ticket W4-10a, DEBUGGER.md §2).
lz4_flex = "0.14.0"
toml = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]

# egui_kittest: the headless UI-test harness for ticket W4-09's CI smoke
# flow. Same repo and release train as egui itself (emilk/egui), published
# at 0.35.0, so it moves in lockstep with the egui/wgpu pin
# `docs/TECH_STACK.md` rule 2 requires rather than dragging a second
# version in. Dev-only: nothing in the shipped binary touches it.
# `wgpu` (ticket W10-03) renders the real window OFF-SCREEN to an image.
# Three defects this arc were visible in a screenshot and nowhere else —
# two of them tofu boxes, one of which shipped as the FIX for the first.
# See crates/retroforge/tests/renders.rs.
egui_kittest = { version = "0.35.0", features = ["eframe", "wgpu"] }
# PNG ONLY, same as the normal dependency above. Cargo unifies features
# across the graph, so `image = "0.25"` here (W10-03) silently switched the
# AVIF encoder on for everyone: image -> ravif -> rav1e -> libfuzzer-sys,
# which is "(MIT OR Apache-2.0) AND NCSA" and fails the NFR-011 licence
# gate. The darwin runner's first full run caught it (W12-01, 2026-09-15);
# the tests only ever write PNGs (renders.rs, capture_tour.rs,
# hdpack_reaches_the_app.rs, level_producer.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
criterion = "0.8.2"

[features]
# `audio` turns on real device output (ticket W2-05). OFF by default so
# `cargo test --workspace` needs no ALSA headers on Linux; the binary and
# the soak test enable it. See crates/rf-audio/Cargo.toml for the same
# reasoning one layer down.
default = []
audio = ["rf-audio/device"]
# `gamepad` turns on the real gilrs backend (ticket W2-06), for the same
# CI reason `audio` is opt-in: gilrs reaches for evdev/udev on Linux.
gamepad = ["rf-input/gilrs"]

[[bench]]
name = "debugger_idle"
harness = false
