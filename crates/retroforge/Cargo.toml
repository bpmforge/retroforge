[package]
name = "retroforge"
description = "RetroForge frontend application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rf-core-api = { path = "../rf-core-api" }
# rf-nes: to actually run a core (pre-flight note, ticket W1-06 plan.json
# entry) — exempt from "cores only via rf-core-api" as the app shell
# itself (scripts/validate-arch.sh rule 3).
rf-nes = { path = "../rf-nes" }
# rf-cart: console-agnostic cartridge sniff/validate for the ROM open
# dialog (pre-flight note) — lets "wrong console" be reported before ever
# handing bytes to rf-nes, and is what the synthetic-NROM test fixtures
# below build against (same pattern as rf-harness's own dev-dependency use
# of rf-cart).
rf-cart = { path = "../rf-cart" }
# rf-state: the .rfstate container (ticket W2-04) — the app shell is the
# only layer that may know both a core's state regions and rf-state's chunk
# tags, since core crates may not depend on rf-state (validate-arch.sh).
rf-state = { path = "../rf-state" }
# rf-audio: ring, dynamic rate control and the output-stage filters
# (ticket W2-05). The `device` feature (cpal) is enabled by the binary, not
# here, so `cargo test --workspace` needs no ALSA headers.
rf-audio = { path = "../rf-audio" }
rf-renderer = { path = "../rf-renderer" }
# rf-input: host-agnostic Key/KeyMap/InputLatch + .rfreplay (ticket W1-07).
rf-input = { path = "../rf-input" }
# rf-enhance: SceneGraph/Camera/Stitcher/SceneTracker (ticket W4-03e) — the
# shell is the mediator that resolves rf-enhance's handles into
# rf-renderer's CompositeLayer (ARCHITECTURE.md §3: UI depends on both REN
# and ENH; no edge between REN and ENH themselves).
rf-enhance = { path = "../rf-enhance" }
# rf-cache: already an rf-enhance dependency (arrives transitively for
# version-resolution purposes), listed directly here too because
# `crate::canvas_accum` calls `rf_cache::Cache::open` itself (Rust's
# extern prelude only exposes crates a Cargo.toml names directly).
rf-cache = { path = "../rf-cache" }
# rf-debugger: viewer data providers + persisted-layout data model (ticket
# W4-06a) — this crate is the shell-mediation point `rf-debugger`'s own
# pre-flight notes call for: `rf-debugger` may not depend on `rf-nes`
# (scripts/validate-arch.sh rule 3), so it never sees CHR/OAM/event bytes
# itself. `retroforge` reads them (it already depends on `rf-nes` above)
# and hands plain `&[u8]`/`&[CoreEvent]` slices to `rf-debugger`'s decode
# functions — same resolution as SceneGraph at W4-03c/W4-03e.
rf-debugger = { path = "../rf-debugger" }
eframe = "0.35.0"
rfd = "0.17.2"
# sha2: reachable-state hash for the determinism/replay suite (ticket
# W1-07) — already an approved dependency (docs/TECH_STACK.md §2 row
# exists via rf-cart's use of it).
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# egui_dock: sanctioned at docs/TECH_STACK.md §2 ("Docking" row, "Mesen-
# style dockable viewer layout") — ticket W4-06a criterion 3. The `serde`
# feature is deliberately NOT enabled: `DockState<Tab>`'s own tree embeds
# `egui::Rect` (whose `Serialize`/`Deserialize` impls are behind egui's own
# `serde` feature, unverified/unenabled in this workspace's `eframe` build)
# and a mixed unit/tuple-variant `Node<Tab>` enum inside a `Vec` — exactly
# the shape TOML's serde support (this workspace's only sanctioned
# serialization format, `docs/TECH_STACK.md` §2 "Config/profiles" row)
# breaks on. `crate::debug_dock` instead owns a small versioned layout
# format it controls (`rf_debugger::layout::PersistedLayout`) and walks
# `DockState`'s public `Tree`/`Node`/`SplitNode`/`LeafNode`/`split()` API
# (all plain data + safe constructors, verified against the vendored
# `egui_dock-0.20.1` source, not training data) to capture/restore it —
# see that module's doc for the full reasoning.
egui_dock = "0.20.1"

[dev-dependencies]
# rf-profiles: dev-only, for the ticket W4-06b criterion-2 integration test
# (`tests/profile_skeleton_export.rs`) to re-parse the exported skeleton
# with the real loader (`rf_profiles::load_file`) after round-tripping it
# through the actual `retroforge-tool` CLI as a subprocess, and assert
# `source` actually survived (not just that the CLI exited 0 — an unknown-
# key typo would still exit 0 with a warning). Not a `[dependencies]`
# entry: nothing in this crate's production code touches `rf-profiles`.
rf-profiles = { path = "../rf-profiles" }

[features]
# `audio` turns on real device output (ticket W2-05). OFF by default so
# `cargo test --workspace` needs no ALSA headers on Linux; the binary and
# the soak test enable it. See crates/rf-audio/Cargo.toml for the same
# reasoning one layer down.
default = []
audio = ["rf-audio/device"]
