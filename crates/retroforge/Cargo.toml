[package]
name = "retroforge"
description = "RetroForge frontend application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rf-core-api = { path = "../rf-core-api" }
# rf-nes: to actually run a core (pre-flight note, ticket W1-06 plan.json
# entry) — exempt from "cores only via rf-core-api" as the app shell
# itself (scripts/validate-arch.sh rule 3).
rf-nes = { path = "../rf-nes" }
# rf-cart: console-agnostic cartridge sniff/validate for the ROM open
# dialog (pre-flight note) — lets "wrong console" be reported before ever
# handing bytes to rf-nes, and is what the synthetic-NROM test fixtures
# below build against (same pattern as rf-harness's own dev-dependency use
# of rf-cart).
rf-cart = { path = "../rf-cart" }
rf-renderer = { path = "../rf-renderer" }
# rf-input: host-agnostic Key/KeyMap/InputLatch + .rfreplay (ticket W1-07).
rf-input = { path = "../rf-input" }
# rf-enhance: SceneGraph/Camera/Stitcher/SceneTracker (ticket W4-03e) — the
# shell is the mediator that resolves rf-enhance's handles into
# rf-renderer's CompositeLayer (ARCHITECTURE.md §3: UI depends on both REN
# and ENH; no edge between REN and ENH themselves).
rf-enhance = { path = "../rf-enhance" }
# rf-cache: already an rf-enhance dependency (arrives transitively for
# version-resolution purposes), listed directly here too because
# `crate::canvas_accum` calls `rf_cache::Cache::open` itself (Rust's
# extern prelude only exposes crates a Cargo.toml names directly).
rf-cache = { path = "../rf-cache" }
eframe = "0.35.0"
rfd = "0.17.2"
# sha2: reachable-state hash for the determinism/replay suite (ticket
# W1-07) — already an approved dependency (docs/TECH_STACK.md §2 row
# exists via rf-cart's use of it).
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
