[package]
name = "rf-nes"
description = "NES core: 2A03 CPU, PPU, APU, mappers (consumes rf-cart for cartridge metadata)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rf-cart = { path = "../rf-cart" }
rf-core-api = { path = "../rf-core-api" }
rf-rebuild = { path = "../rf-rebuild" }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "cpu_step"
harness = false

[[bench]]
name = "event_emission"
harness = false

# Ticket W2-09: whole-machine ms/frame, the quantity NFR-002 states a budget
# for. `event_emission`'s frame arm ticks the PPU alone, which is a lower
# bound on the machine's cost -- see machine_frame.rs's module doc.
[[bench]]
name = "machine_frame"
harness = false

# Ticket W36-01: NesCore frame cost with the coverage recorder off vs armed
# (the off number is the "zero cost when disarmed" claim).
[[bench]]
name = "coverage"
harness = false

# Ticket W36-12: the Amdahl bench for the rebuild JIT ceiling (real frame vs
# the same instruction stream on a flat bus).
[[bench]]
name = "amdahl"
harness = false
