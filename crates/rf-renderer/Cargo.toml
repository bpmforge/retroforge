[package]
name = "rf-renderer"
description = "Renderer abstraction over wgpu: original + enhanced pipelines, shader chains"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# MetalFX spatial-upscale timing spike (ticket W16-01;
# docs/design/ENHANCEMENT_WAVE_16.md §7-8, acceptance criterion 3). OFF BY
# DEFAULT and macOS-only (see the target-gated dependency below) -- same
# "external, off-by-default" posture as rf-ai's `onnx` feature.
metalfx = ["dep:objc2", "dep:objc2-metal", "dep:objc2-metal-fx", "dep:objc2-foundation"]

[dependencies]
rf-core-api = { path = "../rf-core-api" }
wgpu = "29.0.4"
# Blocks on the async wgpu 29 request_adapter/request_device/enumerate_adapters
# futures with no executor of our own (see docs/TECH_STACK.md's "wgpu 29 API
# traps" section) -- already resolved transitively via eframe (Cargo.lock:
# pollster 0.4.0), pinned directly here since headless rf-renderer does not
# depend on eframe to reach it.
pollster = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
# MIT (objc2 project) -- verified https://github.com/madsmtm/objc2's
# LICENSE.txt. `default-features = false`: this crate only needs the raw
# Metal/MetalFX bindings for the timing spike, not objc2's higher-level
# app-kit/foundation conveniences.
objc2 = { version = "0.6", optional = true, default-features = false }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = ["std"] }
objc2-metal-fx = { version = "0.3", optional = true, default-features = false, features = ["std", "MTLFXSpatialScaler"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[[bin]]
name = "gen-pal"
path = "src/bin/gen_pal.rs"

[[bin]]
name = "bench-passes"
path = "src/bin/bench_passes/main.rs"
