# Canonical waiver file (ticket W0-03; TESTING.md §5, R-C1/R-D4).
#
# This file is an ENFORCEMENT mechanism, not a TODO list (TESTING.md §5,
# verbatim): every known-fail carries a justification AND an expiry date;
# an expired waiver reopens red; a red row with no valid waiver here fails
# the accuracy-report step outright (see `rf_harness::accuracy::build_report`).
#
# Lives under `crates/rf-harness/` (not `tests/`) because `tests/` is
# outside this ticket's write scope — only `tests/rom-manifest.toml` is
# listed there. Test fixtures that need their own waiver documents live
# under `crates/rf-harness/tests/` as separate files/inline strings, never
# by hand-editing this one.
#
# Schema — one [[waiver]] per known-fail:
#   suite          suite id (matches [[suite]].id in tests/rom-manifest.toml)
#   rom            ROM label to waive, or "*" to waive every ROM in `suite`
#   justification  why this is currently expected to fail (non-empty)
#   expiry         ISO YYYY-MM-DD; valid through and including this date
#   ticket         tracking ticket id (^W\d+-\d{2}[a-z]?$), MUST be open —
#                  a closed/nonexistent ticket fails the report step too
#
# Waiver history for `ppu_vbl_nmi`: raised by W1-05b at 6 of 10 failing
# (2026-08-03), reduced to 1 of 10 by W1-05c (2026-08-05), and DELETED
# outright by W1-05d (2026-08-16) when `10-even_odd_timing` was made to
# pass. Nothing in this file waives `ppu_vbl_nmi` any more, and the entry
# was removed rather than re-dated -- the ROM passes, so there is nothing
# left to justify. The root-cause history now lives where the code is:
# `crate::ppu::Ppu::render_enable_pipe` (rf-nes) carries the measurement
# and the nesdev citation, and `docs/STATUS.md`'s W1-05c/W1-05d entries
# carry the per-ROM evidence.
#
# Waiver history for the Tier-B set: raised 2026-08-16 by W2-09's first
# run of the nightly tier (7 waivers: ppu_open_bus, cpu_exec_space x2,
# cpu_dummy_writes_ppumem, cpu_dummy_reads, oam_stress, ppu_read_buffer)
# and DELETED outright by W2-19 the same day, because all seven now pass.
# Deleted rather than re-dated, per that ticket's own last criterion --
# the ROMs pass, so there is nothing left to justify.
#
# Root causes, for whoever reads this next: four were ONE bug (the PPU's
# decay register -- its own open-bus latch, which this crate did not have,
# having only the CPU-side one) plus the controller's power-on shift
# state. Two were budgets that were genuinely too small, measured by
# bisection rather than raised until green (ppu_read_buffer needs ~1300
# frames and had 600; oam_stress needs ~3620 and had 3600 -- short by
# twenty frames). One, cpu_dummy_reads, was never failing at all: it is a
# screen-only ROM that was tagged `six_thousand`, so it read as a hang.
# The code carries the detail: `crate::ppu::Ppu::decay` (rf-nes),
# `Controller::default`, and the manifest comments on the three suites.

# ----------------------------------------------------------------------
# Tier-A CPU known-fail, narrowed 2026-08-16 by W2-20.
#
# W2-12 raised THREE waivers here. Two are now DELETED rather than
# re-dated, because the ROMs pass: `cpu_timing_test6` (the interrupt-poll
# fix -- its "FAIL OP :$00" was never a BRK timing bug) and
# `instr_test-v5` (LXA's magic constant moved to $FF; see
# `cpu::tests::vectors::LXA_CONVENTION_CLASH_OPCODE` for the oracle
# clash that documents). The one below is re-pointed at the NEW ticket
# that owns what is actually left, which is not a CPU defect at all.

[[waiver]]
suite = "cpu_interrupts_v2"
rom = "cpu_interrupts"
justification = "Test 2 of 5 (`2-nmi_and_brk`) PASSES as of W2-20 -- exact, all ten delay rows. What fails now is test 3 of 5, `3-nmi_and_irq`, which W2-20 unmasked and which is an APU frame-counter IRQ timing defect, not a CPU one: the IRQ is recognised ~2 CPU cycles early and the error alternates with iteration parity, so the ROM's seven identical rows come out alternating 21/20. Verified NOT to be the $4017 3-vs-4-cycle write-delay polarity (flipping it does not fix test 3). Owned by W2-21."
expiry = "2026-11-01"
ticket = "W2-21"
