# Canonical waiver file (ticket W0-03; TESTING.md §5, R-C1/R-D4).
#
# This file is an ENFORCEMENT mechanism, not a TODO list (TESTING.md §5,
# verbatim): every known-fail carries a justification AND an expiry date;
# an expired waiver reopens red; a red row with no valid waiver here fails
# the accuracy-report step outright (see `rf_harness::accuracy::build_report`).
#
# Lives under `crates/rf-harness/` (not `tests/`) because `tests/` is
# outside this ticket's write scope — only `tests/rom-manifest.toml` is
# listed there. Test fixtures that need their own waiver documents live
# under `crates/rf-harness/tests/` as separate files/inline strings, never
# by hand-editing this one.
#
# Schema — one [[waiver]] per known-fail:
#   suite          suite id (matches [[suite]].id in tests/rom-manifest.toml)
#   rom            ROM label to waive, or "*" to waive every ROM in `suite`
#   justification  why this is currently expected to fail (non-empty)
#   expiry         ISO YYYY-MM-DD; valid through and including this date
#   ticket         tracking ticket id (^W\d+-\d{2}[a-z]?$), MUST be open —
#                  a closed/nonexistent ticket fails the report step too
#
# Waiver history for `ppu_vbl_nmi`: raised by W1-05b at 6 of 10 failing
# (2026-08-03), reduced to 1 of 10 by W1-05c (2026-08-05), and DELETED
# outright by W1-05d (2026-08-16) when `10-even_odd_timing` was made to
# pass. Nothing in this file waives `ppu_vbl_nmi` any more, and the entry
# was removed rather than re-dated -- the ROM passes, so there is nothing
# left to justify. The root-cause history now lives where the code is:
# `crate::ppu::Ppu::render_enable_pipe` (rf-nes) carries the measurement
# and the nesdev citation, and `docs/STATUS.md`'s W1-05c/W1-05d entries
# carry the per-ROM evidence.
#
# ----------------------------------------------------------------------
# Tier-B known-fails, raised 2026-08-16 by W2-09's FIRST run of the nightly
# Tier-B tier -- which is precisely what that tier exists to find. Every one
# is a real ROM failing today against a real accuracy gap, quoted below in
# the ROM's own words. All are owned by W2-19, whose last acceptance
# criterion is that these entries be DELETED rather than re-dated.
#
# Expiry is 2026-11-01, matching the horizon the ppu_vbl_nmi waivers used:
# far enough out to be fixable deliberately, near enough that nobody
# forgets. `crates/rf-harness/src/bin/tier_b_suites.rs` refuses a waiver
# that covers a ROM which has started passing, so these cannot quietly
# outlive the bug.

[[waiver]]
suite = "ppu_open_bus"
rom = "ppu_open_bus"
justification = "PPU OPEN-BUS DECAY IS NOT MODELLED. The ROM's own words: 'Write to any PPU register should set decay value' (Failed #2). This crate models a bus-level open-bus latch (NesBus::open_bus) but not the PPU's separately-decaying bus, and writes to write-only PPU registers do not refresh it. Owned by W2-19; likely the same root cause as cpu_exec_space's PPU arm."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "cpu_exec_space"
rom = "test_cpu_exec_space_ppuio"
justification = "Same PPU open-bus gap, stated independently by a second ROM: 'PPU open bus implementation is missing or incomplete: A write to $2003, followed by a read from $2001 should return the same value as was written' (Failed #3). Owned by W2-19."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "cpu_exec_space"
rom = "test_cpu_exec_space_apu"
justification = "APU-range open bus: the ROM enumerates $4000-$4016 plus the unallocated $4018-$40FF and expects open bus from every write-only port, then fails with 'Mysteriously Landed at $1A34' (Failed #2) when execution from I/O space diverges. W2-01a made $4015 a real register; the write-only ports and unallocated space still do not read as open bus. Owned by W2-19."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "cpu_dummy_writes"
rom = "cpu_dummy_writes_ppumem"
justification = "Read-modify-write double-write behaviour against PPU memory: '675 ERRORS ... 42 OPCODES FAILED THE TEST' (Failed #9), with the failure table showing open-bus reads returning $FF where the written value is expected -- the same PPU open-bus gap seen from the RMW side. Its sibling cpu_dummy_writes_oam PASSES, which is what localizes this to the PPU-memory path rather than to RMW timing generally. Owned by W2-19."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "cpu_dummy_reads"
rom = "cpu_dummy_reads"
justification = "The ROM never reaches its own test-status init: 600 frames elapse and the $6001-$6003 signature never becomes valid. That is a DIFFERENT failure shape from the others here (it is not reporting a wrong answer, it is not getting far enough to report one), so do not assume it shares their root cause. Owned by W2-19."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "oam_stress"
rom = "oam_stress"
justification = "Fails with a CRC mismatch (59916E5B) and a visibly wrong sprite pattern in its own output. $2004/OAMADDR behaviour under stress is not modelled to this ROM's standard. Owned by W2-19."
expiry = "2026-11-01"
ticket = "W2-19"

[[waiver]]
suite = "ppu_read_buffer"
rom = "test_ppu_read_buffer"
justification = "TIMES OUT rather than failing: 600 frames elapse with a valid signature but $6000 never leaves $80 (running). Deliberately waived as a timeout, NOT as a wrong answer -- W2-19's own acceptance says to establish whether the ROM is genuinely slow or whether this engine stalled it, because a frame budget raised until it passes is the exact shape of a gate that stops gating."
expiry = "2026-11-01"
ticket = "W2-19"

# ----------------------------------------------------------------------
# Tier-A CPU known-fails, raised 2026-08-16 by W2-12 -- the first execution
# of suites the manifest had been fetching since W0-03 while NO code path
# ran them. Owned by W2-20. Two of the three point at the same place.

[[waiver]]
suite = "cpu_interrupts_v2"
rom = "cpu_interrupts"
justification = "Fails at '2-nmi_and_brk', test 2 of 5: an NMI arriving during BRK is mishandled. Neither of this crate's two headline CPU gates can see it -- SingleStepTests' per-opcode vectors never deliver an interrupt mid-instruction, and nestest's golden trace never takes one at all -- which is exactly why W2-12 wired this suite. Owned by W2-20."
expiry = "2026-11-01"
ticket = "W2-20"

[[waiver]]
suite = "cpu_timing_test6"
rom = "cpu_timing_test"
justification = "Screen reads '6502 TIMING TEST (16 SECONDS) OFFICIAL INSTRUCTIONS ONLY FAIL OP :$00'. Opcode $00 is BRK, so this is very likely the SAME defect cpu_interrupts_v2 reports from the interrupt side rather than a second one -- W2-20's notes say to try to refute that before fixing them separately. Owned by W2-20."
expiry = "2026-11-01"
ticket = "W2-20"

[[waiver]]
suite = "instr_test-v5"
rom = "all_instrs"
justification = "Fails at 'AB ATX #n', test 3 of 16 (03-immediate). $AB is LXA/ATX, one of the genuinely UNSTABLE illegal opcodes whose result depends on an analog magic constant; crate::cpu already models that family via UnstableOp::Lxa. This is a convention mismatch, not a timing bug, and it is NOT the same defect as the two above. Note the 2,560,000-case nes6502 suite covers $AB under SingleStepTests' own convention and passes -- the two conventions can disagree, so W2-20 must check both. Owned by W2-20."
expiry = "2026-11-01"
ticket = "W2-20"
