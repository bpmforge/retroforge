# Canonical waiver file (ticket W0-03; TESTING.md §5, R-C1/R-D4).
#
# This file is an ENFORCEMENT mechanism, not a TODO list (TESTING.md §5,
# verbatim): every known-fail carries a justification AND an expiry date;
# an expired waiver reopens red; a red row with no valid waiver here fails
# the accuracy-report step outright (see `rf_harness::accuracy::build_report`).
#
# Lives under `crates/rf-harness/` (not `tests/`) because `tests/` is
# outside this ticket's write scope — only `tests/rom-manifest.toml` is
# listed there. Test fixtures that need their own waiver documents live
# under `crates/rf-harness/tests/` as separate files/inline strings, never
# by hand-editing this one.
#
# Schema — one [[waiver]] per known-fail:
#   suite          suite id (matches [[suite]].id in tests/rom-manifest.toml)
#   rom            ROM label to waive, or "*" to waive every ROM in `suite`
#   justification  why this is currently expected to fail (non-empty)
#   expiry         ISO YYYY-MM-DD; valid through and including this date
#   ticket         tracking ticket id (^W\d+-\d{2}[a-c]?$), MUST be open —
#                  a closed/nonexistent ticket fails the report step too
#
# First real waivers (raised by ticket W1-05b, OWNED by W1-05c, 2026-08-03): 6 of the 10 real,
# fetched `ppu_vbl_nmi` sub-ROMs fail against this crate's real NesBus+Cpu.
# Investigated, not guessed at: `crate::ppu`'s module doc "One VBlank/NMI
# race this module does NOT reach" section derives the architectural
# ceiling this crate's lock-step tick-after-register-access ordering hits
# (verified against nesdev.org/wiki/PPU_frame_timing's "VBL Flag Timing"
# table and nesdev.org/wiki/NMI, cross-checked against a matching
# "fails at row 03" symptom independently reported by another emulator
# author on forums.nesdev.org/viewtopic.php?t=17682). All 6 failures below
# show the SAME signature against the real, fetched expected tables (a
# discrepancy of exactly one CPU cycle / 3 PPU dots at the suppression/
# skip boundary, not a wrong transition point or wrong logic), consistent
# with one shared root cause rather than six independent bugs. Fixing it
# would require restructuring when `nmi_line()`/mask-write-timing are
# sampled relative to `NesBus::tick_master`'s 3-dots-per-cycle batching —
# CPU-crate-adjacent territory outside this ticket's `crates/rf-nes/src/
# ppu/**`-plus-`system/mod.rs` write scope, and a real risk to the
# already-byte-exact nestest/vector suites if attempted carelessly.
