justification = "VBL-flag-set suppression fires one CPU cycle (3 PPU dots) earlier than the real fetched ROM's expected table (suppression row 03 vs. expected row 04); column 1's own set-transition point matches real hardware exactly, isolating the discrepancy to the read-vs-tick sub-cycle race documented in crate::ppu's module doc. See docs/STATUS.md's W1-05b entry for the full investigation."
expiry = "2026-11-01"
ticket = "W1-05c"

