# Canonical waiver file (ticket W0-03; TESTING.md §5, R-C1/R-D4).
#
# This file is an ENFORCEMENT mechanism, not a TODO list (TESTING.md §5,
# verbatim): every known-fail carries a justification AND an expiry date;
# an expired waiver reopens red; a red row with no valid waiver here fails
# the accuracy-report step outright (see `rf_harness::accuracy::build_report`).
#
# Lives under `crates/rf-harness/` (not `tests/`) because `tests/` is
# outside this ticket's write scope — only `tests/rom-manifest.toml` is
# listed there. Test fixtures that need their own waiver documents live
# under `crates/rf-harness/tests/` as separate files/inline strings, never
# by hand-editing this one.
#
# Schema — one [[waiver]] per known-fail:
#   suite          suite id (matches [[suite]].id in tests/rom-manifest.toml)
#   rom            ROM label to waive, or "*" to waive every ROM in `suite`
#   justification  why this is currently expected to fail (non-empty)
#   expiry         ISO YYYY-MM-DD; valid through and including this date
#   ticket         tracking ticket id (^W\d+-\d{2}[a-z]?$), MUST be open —
#                  a closed/nonexistent ticket fails the report step too
#
# Waiver history for `ppu_vbl_nmi` (raised by W1-05b at 6 of 10 failing,
# 2026-08-03; reduced to 1 of 10 by W1-05c, 2026-08-05).
#
# W1-05b's five read-side waivers (02-vbl_set_time, 05-nmi_timing,
# 06-suppression, 07-nmi_on_timing, 08-nmi_off_timing) are DELETED, not
# re-dated: W1-05c made those ROMs actually pass, via two separable
# mechanisms — `Ppu::read_status` answering more rows of nesdev's "VBL Flag
# Timing" table (the same-clock (241,1) case and its (261,1) clear-side
# mirror), and `NesBus::nmi_level_latch`, a one-PPU-DOT-delayed snapshot of
# the NMI level. Both are mutation-verified as separable: reverting the
# read_status arm alone breaks 02/03/05/06/07/08, reverting the latch alone
# breaks only 05/06/07/08.
#
# W1-05b's ONE-SHARED-ROOT-CAUSE HYPOTHESIS IS NOW PARTLY REFUTED, and this
# comment is corrected rather than left to rot. That hypothesis grouped all
# six failures — including 10-even_odd_timing — under a single "one CPU
# cycle / 3 PPU dots early" signature. It held for the five read-side ROMs.
# It did NOT hold for 10-even_odd_timing, whose waiver below is rewritten
# accordingly: W1-05c tried both `CpuBus::read` orderings and every
# `read_status` model that fixed the other five, and 10 failed identically
# under all of them. Its symptom needs a `$2001` write to take effect
# EARLIER, while every mechanism W1-05c introduced moves effects LATER, so
# no single uniform shift can satisfy both — which is why one ticket could
# not close both defects.
[[waiver]]
suite = "ppu_vbl_nmi"
rom = "10-even_odd_timing"
justification = "Fails at 'Clock is skipped too late, relative to enabling BG' (sub-test #3 of 4; #2 and #4 pass) -- off by one busy-poll loop iteration on the $2001-write side of the odd-frame dot-339 skip. CORRECTED 2026-08-05 (W1-05c): this is NOT the same root cause as the five read-side ROMs W1-05b grouped it with -- that grouping is refuted, not merely unproven. W1-05c fixed all five and 10 failed IDENTICALLY under every variant tried (both CpuBus::read orderings, every read_status model). Direction of error is the discriminator: the read-side five needed effects to land one cycle LATER, while this needs a $2001 write to land EARLIER, so no uniform re-sequencing satisfies both. Remaining work: model when a $2001 mask write takes effect relative to the pre-render line's dot-339/340 odd-frame skip decision. Do not retry by re-sequencing register access globally -- that is measured to not work."
expiry = "2026-11-01"
ticket = "W1-05d"
