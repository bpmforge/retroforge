[package]
name = "rf-harness"
description = "Test harness: test-ROM runner, golden-frame compare, determinism checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rf-core-api = { path = "../rf-core-api" }
# rf-nes: only for the nes6502-vectors local-gate evidence runner (ticket
# W0-07, src/nes6502_evidence.rs) — rf-harness is exempted from the
# "console cores only via rf-core-api" layer rule as "the test harness"
# itself (scripts/validate-arch.sh rule 3).
rf-nes = { path = "../rf-nes" }
# rf-snes: the RF-Scroller-S replay gate (ticket W6-05, FR-CORE-037), the
# SNES counterpart of the rf-nes dependency above and permitted by the
# same no-direct-core exemption.
rf-snes = { path = "../rf-snes" }
# rf-enhance + rf-profiles: ticket W5-02b runs the offline
# `metatile_screens` decoder against a live core and compares its output
# with the nametable bytes the ROM itself streams into VRAM. rf-enhance
# cannot host that test — validate-arch rule 3 exempts only
# retroforge/rf-harness/rf-nes/rf-snes from the no-direct-core rule — so
# the harness, which already depends on cores legitimately, is where the
# two sides can meet.
rf-enhance = { path = "../rf-enhance" }
rf-profiles = { path = "../rf-profiles" }
sha2 = "0.11"
toml = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# rf-cart: nestest_evidence.rs's own unit tests build a minimal synthetic
# NROM image the same way crates/rf-nes/src/system/tests already does
# (rf_cart::nes::INES_MAGIC) rather than vendoring any real nestest.nes
# bytes (TESTING.md §3 G-43). Also used by tests/alter_ego_replay.rs
# (ticket W2-11) to sniff the single NES ROM out of the fetched
# `alter_ego.zip`, the same content-sniff `crates/retroforge/src/rom_open.rs`
# uses rather than trusting a zip entry's file extension.
rf-cart = { path = "../rf-cart" }
# rf-enhance: ticket W4-03d's fixture-driven scene-identity validation
# (tests/rf_scroller_scene_tracker.rs) -- the SceneTracker itself lives in
# rf-enhance (scripts/validate-arch.sh rule 3 forbids rf-enhance depending
# on a console core directly, so the fixture-driven half of this ticket
# lives here instead, dev-depending on rf-enhance the same shape
# rf-renderer already does below). Test-only: no rf-harness binary or
# library API touches rf-enhance.
rf-enhance = { path = "../rf-enhance" }
# rf-renderer: ticket W3-01's headless wgpu golden-frame test
# (tests/golden_frame_gpu.rs) -- rf-harness -> rf-renderer is a harness ->
# host-service dependency, unconstrained by scripts/validate-arch.sh (rule 1
# only guards the core crates; rule 3 only guards direct access to console
# cores). Test-only: the palette pass is exercised from a test, not shipped
# as part of any rf-harness binary.
rf-renderer = { path = "../rf-renderer" }
# rf-input: the `.rfreplay` format (ticket W1-07) -- tests/alter_ego_replay.rs
# (ticket W2-11) records/round-trips/replays the scripted 5-minute input log
# through it rather than inventing a second input-log serialization. Test-only
# (no rf-harness binary or library API touches a replay log).
rf-input = { path = "../rf-input" }
# zip: unpack the fetched `alter_ego.zip` for tests/alter_ego_replay.rs
# (ticket W2-11) -- see docs/TECH_STACK.md §2's Archive row (amended by this
# ticket) for why a second, test-only home for this dependency doesn't
# reopen the "keep it out of the NES core" reasoning that keeps it out of
# rf-cart, and crates/retroforge/src/rom_open.rs's module doc for the
# untrusted-zip posture this reuses. Same version/feature pin as
# crates/retroforge's Cargo.toml -- deliberately not a second TECH_STACK
# decision.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[[bin]]
name = "fetch-test-roms"
path = "src/bin/fetch_test_roms.rs"

[[bin]]
name = "local-gate-evidence"
path = "src/bin/local_gate_evidence.rs"
