[package]
name = "rf-harness"
description = "Test harness: test-ROM runner, golden-frame compare, determinism checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rf-core-api = { path = "../rf-core-api" }
sha2 = "0.11"
toml = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "fetch-test-roms"
path = "src/bin/fetch_test_roms.rs"
